<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>팬메이드 포켓몬 대미지 계산기 (곱연산 적용)</title>
<style>
  body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f6f9; color: #333; padding: 20px; }
  .container { max-width: 800px; margin: 0 auto; }
  .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
  h2 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
  .grid-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 15px; }
  .input-group { display: flex; flex-direction: column; }
  label { font-weight: bold; font-size: 0.9em; margin-bottom: 5px; color: #555; }
  input, select { padding: 8px 12px; border: 1px solid #ccd1d9; border-radius: 6px; font-size: 1em; }
  input:focus, select:focus { outline: none; border-color: #3498db; }
  .result-box { text-align: center; background-color: #e8f4f8; padding: 20px; border-radius: 12px; }
  .result-title { font-size: 1.2em; font-weight: bold; color: #2980b9; margin-bottom: 10px; }
  .damage-number { font-size: 2.5em; font-weight: 900; color: #e74c3c; margin: 0; }
  .formula-breakdown { font-size: 0.9em; color: #7f8c8d; margin-top: 15px; line-height: 1.6; }
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <h2>⚔️ 포켓몬 & 기술 스탯</h2>
    <div class="grid-row">
      <div class="input-group">
        <label>공격자 힘 (1~5)</label>
        <input type="number" id="force" value="5" min="1" max="5">
      </div>
      <div class="input-group">
        <label>기술 위력</label>
        <input type="number" id="power" value="80" step="10">
      </div>
    </div>
    <div class="grid-row">
      <div class="input-group">
        <label>공격 랭크 (-6~6)</label>
        <input type="number" id="atkRank" value="0" min="-6" max="6">
      </div>
      <div class="input-group">
        <label>방어 랭크 (-6~6)</label>
        <input type="number" id="defRank" value="0" min="-6" max="6">
      </div>
    </div>
    <div class="grid-row">
      <div class="input-group">
        <label>자속 보정</label>
        <select id="stab">
          <option value="1.5" selected>적용 (1.5배)</option>
          <option value="1.0">미적용 (1배)</option>
        </select>
      </div>
      <div class="input-group">
        <label>타입 상성</label>
        <select id="typeMatch">
          <option value="2.0" selected>효과가 굉장했다 (2배)</option>
          <option value="1.0">보통 (1배)</option>
          <option value="0.5">효과가 별로... (0.5배)</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>⚙️ 상수 및 난수 설정</h2>
    <div class="grid-row">
      <div class="input-group">
        <label>나누기 상수</label>
        <input type="number" id="divider" value="15" step="1">
      </div>
      <div class="input-group">
        <label>난수(주사위) 최솟값</label>
        <input type="number" id="randMin" value="1">
      </div>
      <div class="input-group">
        <label>난수(주사위) 최댓값</label>
        <input type="number" id="randMax" value="4">
      </div>
    </div>
  </div>

  <div class="card result-box">
    <div class="result-title">예상 최종 대미지 (최소 ~ 최대)</div>
    <p class="damage-number" id="finalDamageDisplay">0 ~ 0</p>
    
    <div class="formula-breakdown" id="breakdownDisplay">
      계산 내역이 여기에 표시됩니다.
    </div>
  </div>
</div>

<script>
  const inputs = document.querySelectorAll('input, select');
  inputs.forEach(input => input.addEventListener('input', calculateDamage));

  function calculateDamage() {
    const force = parseFloat(document.getElementById('force').value) || 0;
    const power = parseFloat(document.getElementById('power').value) || 0;
    const atkRank = parseInt(document.getElementById('atkRank').value) || 0;
    const defRank = parseInt(document.getElementById('defRank').value) || 0;
    const stab = parseFloat(document.getElementById('stab').value) || 1;
    const typeMatch = parseFloat(document.getElementById('typeMatch').value) || 1;
    
    const divider = parseFloat(document.getElementById('divider').value) || 15;
    const randMin = parseFloat(document.getElementById('randMin').value) || 0;
    const randMax = parseFloat(document.getElementById('randMax').value) || 0;

    // 변경된 곱연산 로직 적용
    const baseValue = (force * power) / divider;

    const rankDiff = atkRank - defRank;
    let rankMulti = 1.0;
    if (rankDiff >= 0) {
      rankMulti = (2 + rankDiff) / 2;
    } else {
      rankMulti = 2 / (2 + Math.abs(rankDiff));
    }

    const multipliers = rankMulti * typeMatch * stab;
    
    let minDamage = (baseValue + randMin) * multipliers;
    let maxDamage = (baseValue + randMax) * multipliers;

    // 소수점 내림 처리 (포켓몬 본가 방식)
    minDamage = Math.floor(minDamage);
    maxDamage = Math.floor(maxDamage);

    document.getElementById('finalDamageDisplay').innerText = `${minDamage} ~ ${maxDamage}`;
    
    document.getElementById('breakdownDisplay').innerHTML = `
      <strong>[계산 과정 상세]</strong><br>
      • 기본 고정값: (${force} × ${power}) ÷ ${divider} = <strong>${baseValue.toFixed(2)}</strong><br>
      • 랭크 보정배율: 랭크격차 ${rankDiff}단계 적용 ➔ <strong>${rankMulti.toFixed(2)}배</strong><br>
      • 최소 대미지: (${baseValue.toFixed(2)} + 주사위 ${randMin}) × (랭크 ${rankMulti.toFixed(2)} × 상성 ${typeMatch} × 자속 ${stab}) = ${minDamage}<br>
      • 최대 대미지: (${baseValue.toFixed(2)} + 주사위 ${randMax}) × (랭크 ${rankMulti.toFixed(2)} × 상성 ${typeMatch} × 자속 ${stab}) = ${maxDamage}
    `;
  }

  calculateDamage();
</script>

</body>
</html>
